<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Completo</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins&display=swap');

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .campoCreate {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            background: rgba(255, 255, 255, 1);
            align-items: center;
            justify-content: center;
        }

        /* AGORA O FORMULÁRIO É GRID DE 2 COLUNAS */
        #forme_create_user {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 20px;
            background: rgba(255, 255, 255, 1);
            box-shadow: 0px 0px 25px 10px rgba(0, 0, 0, 0.1);
            padding: 40px;
            border: 1px solid rgba(62, 91, 89, 1);
            border-radius: 5px;
        }

        .linhaCampo {
            display: flex;
            align-items: center;
        }

        #forme_create_user label {
            font-family: "Poppins";
            font-size: 12px; 
            width: 120px;
            text-align: right;
            margin-right: 8px;
        }

        #forme_create_user input {
            padding: 5px;
            width: 180px;
            height: 30px;
            background-color: rgba(221, 221, 221, 1);
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
        }

        /* BOTÃO AGORA OCUPA AS 2 COLUNAS */
        #forme_create_user button {
            grid-column: span 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-family: "Poppins";
            background-color: rgba(1, 153, 63, 1);
            color: white;
            cursor: pointer;
            height: 40px;
            margin-top: 10px;
        }

        #forme_create_user h1 {
            grid-column: span 2;
            font-family: "Open Sans";
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="campoCreate">
        <div id="forme_create_user">
            <h1>CADASTRO COMPLETO</h1>

            <div class="linhaCampo"><label>Fundo</label><input type="text" id="fundo"></div>
            <div class="linhaCampo"><label>Unidade</label><input type="text" id="unidade"></div>
            <div class="linhaCampo"><label>Espécie</label><input type="text" id="especie"></div>
            <div class="linhaCampo"><label>Interessado</label><input type="text" id="interessado"></div>
            <div class="linhaCampo"><label>Assunto Detalhado</label><input type="text" id="assuntoDetalhado"></div>
            <div class="linhaCampo"><label>Código de Classificação</label><input type="text" id="codigoClassificacao"></div>
            <div class="linhaCampo"><label>Prazo de Guarda</label><input type="text" id="prazoGuarda"></div>
            <div class="linhaCampo"><label>Destinação Final</label><input type="text" id="destinacaoFinal"></div>
            <div class="linhaCampo"><label>Data de Destinação</label><input type="date" id="dataDestinacao"></div>
            <div class="linhaCampo"><label>Ordem do Documento</label><input type="text" id="ordemDocumento"></div>
            <div class="linhaCampo"><label>Número do Documento</label><input type="text" id="numeroDocumento"></div>
            <div class="linhaCampo"><label>CPF ou CNPJ</label><input type="text" id="cpfCnpj"></div>
            <div class="linhaCampo"><label>Matrícula SIAPE</label><input type="text" id="matriculaSiape"></div>
            <div class="linhaCampo"><label>Data de Nascimento</label><input type="date" id="dataNascimento"></div>
            <div class="linhaCampo"><label>Ano Ingresso/Admissão</label><input type="text" id="anoIngressoDataAdmissao"></div>
            <div class="linhaCampo"><label>Nome da Mãe</label><input type="text" id="nomeMae"></div>
            <div class="linhaCampo"><label>Curso</label><input type="text" id="curso"></div>
            <div class="linhaCampo"><label>Disciplina / Professor</label><input type="text" id="disciplinaProfessor"></div>
            <div class="linhaCampo"><label>Data de Produção</label><input type="date" id="dataProducao"></div>
            <div class="linhaCampo"><label>Prestação de Contas</label><input type="text" id="prestacaoContas"></div>
            <div class="linhaCampo"><label>Data de Transferência</label><input type="date" id="dataTransferencia"></div>
            <div class="linhaCampo"><label>Observação</label><input type="text" id="observacao"></div>

            <button>Cadastrar</button>
        </div>
    </div>

</body>
</html>
